name: lake-build
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lake-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # --default-toolchain none: elan reads lean-toolchain, so CI can never drift from local.
      - name: install-elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh \
            | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Keyed on the manifest: a dependency bump gets a fresh cache, everything else reuses it.
      # Avoids re-downloading ~7 GB of Mathlib oleans each run.
      # Only `.lake/packages` is cached: `.lake/build` holds *our* oleans, and caching them
      # would freeze stale artifacts in place forever.
      - name: restore-mathlib-oleans
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: fetch-mathlib-build-cache
        run: lake exe cache get

      # Saved before `lake build` runs, so a failing build still leaves a warm cache
      # for the next attempt instead of re-downloading Mathlib each retry.
      - name: save-mathlib-oleans
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/packages
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: lake-build
        run: lake build
